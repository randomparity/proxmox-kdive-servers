---
- name: Run the selected guest baseline operation
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, playbook_dir + '/../scripts/guests.py'] +
         (['--' + proxmox_guest_operation] if proxmox_guest_operation is defined else
          (['--verify'] if proxmox_guest_verify_only else [])) }}
  register: proxmox_guest_result
  changed_when: >-
    proxmox_guest_result.stdout_lines | map('from_json') |
    selectattr('action', 'in', ['created', 'restored', 'destroyed']) | list | length > 0
  no_log: true

- name: Show guest capacity warnings
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ proxmox_guest_result.stderr_lines | select('match', '^Guest capacity warning: ') | list }}"
